<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos en línea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Los colores salen del negocio (color_primario / color_secundario), como en Annly Agenda */
:root{ --p:#7C3AED; --s:#EC4899; --ink:#1F1B2B; --ink-soft:#6B6680; --line:#ECE8F2; --bg:#FAF8FC; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
main{flex:1;width:100%;}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;}
.wrap{max-width:980px;margin:0 auto;padding:0 18px;}

header{background:#fff;}
/* Barra superior fija */
.barra-top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.barra-top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;}
.marca{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:var(--ink);}
.marca img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff;flex-shrink:0;}
.marca strong{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-wa-top{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:var(--p);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;box-shadow:0 10px 20px -14px var(--p);transition:transform .15s,box-shadow .2s;}
.btn-wa-top:hover{transform:translateY(-1px);box-shadow:0 14px 24px -14px var(--p);}
.btn-wa-top i{font-size:17px;}
/* Portada */
.portada{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 9%,#fff),color-mix(in srgb,var(--s) 12%,#fff));}
.portada::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-160px;background:color-mix(in srgb,var(--p) 16%,#fff);filter:blur(50px);opacity:.7;}
.portada .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding-top:38px;padding-bottom:38px;}
.portada-eyebrow{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--p);}
.portada h1{font-family:'Playfair Display',serif;font-size:44px;line-height:1.08;font-weight:700;letter-spacing:-.015em;margin:10px 0 12px;color:var(--ink);}
.portada h1 em{font-style:normal;color:var(--p);}
.portada-sub{font-size:15px;color:var(--ink-soft);line-height:1.55;max-width:460px;}
.portada-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:transform .15s,box-shadow .2s;}
.cta.principal{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;box-shadow:0 14px 26px -16px var(--p);}
.cta.secundario{background:#fff;color:var(--ink);border:1.5px solid color-mix(in srgb,var(--p) 22%,#fff);}
.cta:hover{transform:translateY(-2px);}
.beneficios{display:flex;flex-wrap:wrap;gap:18px;margin-top:24px;}
.beneficio{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);}
.beneficio i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--p);font-size:17px;box-shadow:0 6px 14px -10px rgba(0,0,0,.4);}
.beneficio b{display:block;color:var(--ink);font-size:13px;}
.portada-foto{position:relative;justify-self:center;width:100%;max-width:360px;aspect-ratio:4/5;border-radius:200px 200px 28px 28px;overflow:hidden;box-shadow:0 30px 50px -30px rgba(31,27,43,.55);background:#fff;}
.portada-foto img{width:100%;height:100%;object-fit:cover;}
.portada-foto .sello{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);border-radius:14px;padding:9px 12px;font-size:12px;line-height:1.35;max-width:75%;}
.portada-foto .sello b{display:block;font-family:'DM Sans',sans-serif;font-size:13px;}
/* Título del catálogo */
.cat-titulo{text-align:center;padding:30px 0 4px;}
.cat-titulo h2{font-family:'Playfair Display',serif;font-size:28px;}
.cat-titulo p{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
.cat-titulo .corazon{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--p);margin-top:8px;}
.cat-titulo .corazon::before,.cat-titulo .corazon::after{content:"";width:46px;height:1px;background:color-mix(in srgb,var(--p) 35%,#fff);}
.cats{justify-content:center;}
@media(max-width:820px){
  .portada .wrap{grid-template-columns:1fr;padding-top:24px;padding-bottom:24px;gap:18px;}
  .portada-foto{display:none;}
  /* La portada elegida por el negocio sí se ve en el celular: arriba, más ancha */
  .portada-foto.propia{display:block;order:-1;max-width:100%;aspect-ratio:16/10;border-radius:22px;}
  .portada h1{font-size:32px;}
}
@media(max-width:560px){
  .barra-top .wrap{height:56px;}
  .marca img{width:36px;height:36px;}
  .marca strong{font-size:16px;}
  .btn-wa-top span{display:none;}
  .btn-wa-top{padding:9px;border-radius:50%;}
  .portada h1{font-size:26px;margin:6px 0 8px;}
  .portada-eyebrow{font-size:10.5px;}
  .portada-sub{font-size:13px;}
  .portada-cta{margin-top:14px;}
  .cta{padding:11px 16px;font-size:13px;}
  .beneficios{gap:10px 14px;margin-top:16px;}
  .beneficio{font-size:11px;gap:7px;}
  .beneficio i{width:28px;height:28px;font-size:14px;}
  .beneficio b{font-size:11.5px;}
  .cat-titulo{padding:14px 0 0;}
  .cat-titulo h2{font-size:21px;}
  .cat-titulo p{font-size:12px;}
  .cats{justify-content:flex-start;}
}
.hero{display:flex;align-items:center;gap:16px;padding:26px 0 22px;}
@media(max-width:560px){.hero{padding:18px 0 16px;gap:12px;}.hero h1{font-size:22px!important;}.hero p{font-size:12.5px!important;}.logo{width:56px!important;height:56px!important;}}
.logo{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--bg);border:1px solid var(--line);flex-shrink:0;}
.hero h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;letter-spacing:-.01em;}
.hero p{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;}
@media(max-width:560px){.cat{padding:7px 13px;font-size:12.5px;}}
.cat{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.cat.on{background:var(--p);border-color:var(--p);color:#fff;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:18px 0 40px;}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}}
.prod{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column;}
.prod-foto{aspect-ratio:1/1;width:100%;object-fit:cover;background:linear-gradient(160deg,color-mix(in srgb,var(--p) 14%,#fff),color-mix(in srgb,var(--s) 14%,#fff));display:grid;place-items:center;color:var(--p);font-size:34px;}
.prod-info{padding:12px 14px 14px;}
@media(max-width:560px){.prod-info{padding:9px 10px 11px;}.prod-info strong{font-size:13.5px;}.prod-info span{font-size:11.5px;}.prod-info b{font-size:14.5px;}}
.prod-info strong{display:block;font-family:'DM Sans',sans-serif;font-size:15px;}
.prod-info span{display:block;font-size:12.5px;color:var(--ink-soft);margin:3px 0 8px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prod-info b{font-family:'DM Sans',sans-serif;font-size:16px;color:var(--p);}
.prod-foto-wrap{position:relative;overflow:hidden;}
/* ---------- Cabecera tipo perfil ---------- */
.perfil{background:var(--bg);}
.perfil-cover{position:relative;height:200px;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--p) 45%,#fff) 0%,var(--p) 55%,color-mix(in srgb,var(--p) 70%,#000) 100%);}
.perfil-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.perfil-velo{position:absolute;inset:0;background:var(--p);opacity:.05;transition:none;}
.perfil-cover.sin-foto{height:76px;background:linear-gradient(120deg,color-mix(in srgb,var(--p) 22%,#fff) 0%,color-mix(in srgb,var(--s) 16%,#fff) 100%);}
.perfil-cover.sin-foto + .perfil-info{margin-top:-58px;}
/* Sin foto, el logo un poco más chico y casi pegado arriba */
.perfil-cover.sin-foto + .perfil-info .perfil-logo{width:112px;height:112px;}
.perfil-fundido{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(180deg,transparent 0%,var(--bg) 100%);}
.perfil-info{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:-64px;padding-bottom:6px;}
.perfil-logo{width:124px;height:124px;border-radius:50%;background:#fff;padding:5px;box-sizing:border-box;box-shadow:0 14px 30px -14px rgba(40,20,10,.55);flex-shrink:0;}
.perfil-logo img,.perfil-logo span{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--p);box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--p) 12%,#fff);font-family:'Playfair Display',serif;font-size:46px;font-weight:700;color:var(--p);}
.perfil-logo img:not([hidden]) + span{display:none;}
.perfil-txt{display:flex;flex-direction:column;align-items:center;gap:4px;}
.perfil-rubro{font:800 11px/1.2 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--p);}
.perfil-txt h1{margin:0;font-family:'Playfair Display',serif;font-size:34px;line-height:1.05;font-weight:700;color:var(--ink);}
.perfil-lema{margin:4px 0 0;font-family:'Playfair Display',serif;font-style:italic;font-size:15.5px;line-height:1.35;color:var(--ink-soft);max-width:520px;}
.perfil-bens{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;}
.promo:not([hidden]) + .cat-titulo{padding-top:6px;}
.perfil-ben{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:999px;}
.perfil-ben i{font-size:14px;color:var(--p);}
.perfil-ben b{font:700 11px/1.2 'DM Sans',sans-serif;color:var(--ink);white-space:nowrap;}
/* Celular: las 3 en una sola línea, con el texto corto */
.ben-largo{display:none;}
@media(max-width:819px){
  .perfil-bens{flex-wrap:nowrap;gap:5px;width:100%;justify-content:center;}
  .perfil-ben{padding:6px 9px;gap:4px;min-width:0;}
  .perfil-ben i{font-size:13px;}
  .perfil-ben b{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;}
}
@media(min-width:820px){.ben-largo{display:inline;}.ben-corto{display:none;}}
@media(min-width:820px){
  .perfil-cover{height:300px;}
  .perfil-cover.sin-foto{height:110px;}
  .perfil-cover.sin-foto + .perfil-info{margin-top:-84px;}
  .perfil-cover.sin-foto + .perfil-info .perfil-logo{width:150px;height:150px;}
  .perfil-info{flex-direction:row;align-items:flex-end;text-align:left;gap:28px;margin-top:-84px;}
  .perfil-logo{width:168px;height:168px;padding:6px;}
  .perfil-logo span{font-size:62px;}
  .perfil-txt{align-items:flex-start;flex:1;min-width:0;padding-bottom:4px;}
  .perfil-txt h1{font-size:50px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .perfil-lema{font-size:19px;}
  .perfil-bens{display:flex;flex-wrap:wrap;justify-content:flex-start;width:auto;margin:10px 0 0;}
  .perfil-ben{flex-direction:row;gap:7px;padding:8px 13px;border-radius:999px;}
  .perfil-ben i{font-size:17px;}
  .perfil-ben b{font-size:12.5px;}
}
.hoja-oferta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-family:'DM Sans',sans-serif;}
.hoja-oferta s{color:#9A97A6;}
.hoja-oferta b{color:#E1306C;font-size:18px;}
.hoja-oferta small{color:#8A8796;font-size:12px;}
.hablador{position:absolute;top:10px;left:10px;background:#E1306C;color:#fff;font:800 12.5px/1 'DM Sans',sans-serif;padding:7px 10px;border-radius:999px;box-shadow:0 6px 14px -6px rgba(225,48,108,.7);transform:rotate(-6deg);}
.precio-oferta s{font-size:.78em;font-weight:500;color:#9A97A6;margin-right:4px;}
.precio-oferta{color:#E1306C!important;}
.promo{position:relative;display:flex;align-items:center;gap:18px;border-radius:24px;padding:22px 22px 22px 24px;margin:4px 0 18px;color:#fff;overflow:hidden;box-shadow:0 18px 40px -24px rgba(60,20,90,.6);}
.promo[hidden]{display:none;}
.promo-txt{flex:1;min-width:0;position:relative;z-index:1;}
/* Entrada: el banner sube con rebote, luego entran el texto y la foto */
.promo.entra{animation:promoEntra .8s cubic-bezier(.2,1.4,.4,1) both;}
.promo.entra .promo-etq{animation:promoPop .5s .35s cubic-bezier(.2,1.6,.4,1) both;}
.promo.entra h2{animation:promoSube .55s .45s ease both;}
.promo.entra .promo-prod,.promo.entra .promo-precio,.promo.entra .promo-vig{animation:promoSube .55s .58s ease both;}
.promo.entra .promo-cta{animation:promoSube .55s .7s ease both, promoLatido 2.4s 1.6s ease-in-out infinite;}
.promo.entra .promo-foto{animation:promoFoto .9s .3s cubic-bezier(.2,1.3,.4,1) both;}
.promo.entra .promo-precio span{animation:promoPop .5s 1s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes promoEntra{from{opacity:0;transform:translateY(26px) scale(.96);}to{opacity:1;transform:none;}}
@keyframes promoSube{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes promoPop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
@keyframes promoFoto{from{opacity:0;transform:rotate(14deg) scale(.7);}to{opacity:1;transform:rotate(3deg) scale(1);}}
@keyframes promoLatido{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
/* Brillo que cruza el banner una vez */
.promo-brillo{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-110%);}
.promo.entra .promo-brillo{animation:promoBrillo 1.3s 1.1s ease-out both;}
@keyframes promoBrillo{to{transform:translateX(110%);}}
/* Confeti */
.promo-etq{cursor:pointer;}
.promo-confeti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
.promo-confeti i{position:absolute;top:-16px;font-style:normal;line-height:1;opacity:0;animation-name:promoCae;animation-timing-function:cubic-bezier(.3,.6,.5,1);animation-fill-mode:forwards;}
@keyframes promoCae{0%{opacity:0;transform:translate(0,0) rotate(0);}10%{opacity:1;}100%{opacity:0;transform:translate(var(--dx),260px) rotate(var(--rot));}}
@media(max-width:560px){.promo.entra .promo-foto{animation-name:promoFotoM;}}
@keyframes promoFotoM{from{opacity:0;transform:scale(.7) rotate(8deg);}to{opacity:1;transform:rotate(3deg);}}
@media(prefers-reduced-motion:reduce){.promo.entra,.promo.entra *{animation:none!important;}}
.promo-etq{display:inline-block;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;font:800 11px/1 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;}
.promo h2{font-family:'Playfair Display',serif;font-size:26px;line-height:1.15;margin:10px 0 6px;}
.promo-prod{font-size:14px;opacity:.92;}
.promo-precio{margin:6px 0 2px;font-family:'DM Sans',sans-serif;}
.promo-precio s{opacity:.75;margin-right:4px;}
.promo-precio b{font-size:24px;}
.promo-precio span{display:inline-block;background:#fff;color:#E1306C;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:800;margin-left:6px;vertical-align:4px;}
.promo-vig{font-size:12px;opacity:.85;}
.promo-cta{margin-top:12px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:#fff;color:#2B2838;font:800 13.5px/1 'DM Sans',sans-serif;padding:11px 18px;cursor:pointer;}
.promo-foto{width:150px;height:150px;border-radius:20px;object-fit:cover;flex-shrink:0;box-shadow:0 12px 26px -12px rgba(0,0,0,.45);transform:rotate(3deg);position:relative;z-index:1;}
.promo-emoji{display:grid;place-items:center;font-size:64px;background:rgba(255,255,255,.2);}
@media(max-width:560px){
  .promo{flex-direction:row;align-items:center;gap:12px;padding:14px 14px 14px 16px;border-radius:20px;margin:2px 0 14px;}
  .promo-etq{font-size:9.5px;padding:4px 8px;}
  .promo h2{font-size:17px;margin:7px 0 2px;}
  .promo-prod{font-size:12.5px;}
  .promo-precio{margin:3px 0 0;}
  .promo-precio b{font-size:18px;}
  .promo-precio s{font-size:12px;}
  .promo-precio span{font-size:10.5px;padding:2px 6px;}
  .promo-vig{font-size:11px;}
  .promo-cta{margin-top:8px;padding:8px 13px;font-size:12px;}
  .promo-foto{width:96px;height:96px;border-radius:16px;align-self:center;}
  .promo-emoji{font-size:40px;}
}

.estado{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:14px;line-height:1.6;}
.estado h2{font-family:'DM Sans',sans-serif;color:var(--ink);font-size:18px;margin-bottom:6px;}

/* Inscripción de clientes */
.club-card{display:flex;align-items:center;gap:14px;width:100%;margin:2px 0 16px;padding:14px 16px;border:1.5px solid color-mix(in srgb,var(--p) 25%,#fff);border-radius:18px;background:color-mix(in srgb,var(--p) 7%,#fff);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);}
.club-card[hidden]{display:none;}
.club-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;color:var(--p);background:#fff;flex:none;}
.club-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.club-txt b{font-size:15px;}.club-txt small{font-size:12.5px;color:var(--ink-soft);}
.club-flecha{color:var(--p);font-size:18px;}
.club-check{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.5;margin:10px 0;cursor:pointer;}
.club-check input{margin-top:3px;flex-shrink:0;accent-color:var(--p);}
/* Detalle del producto */
.ov{position:fixed;inset:0;background:rgba(25,20,35,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.ov.on{display:flex;}
.hoja{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;}
@media(min-width:640px){.ov{align-items:center;}.hoja{border-radius:22px;}}
.hoja-foto{width:100%;height:clamp(200px,34vh,320px);aspect-ratio:auto;object-fit:contain;object-position:center;background:linear-gradient(160deg,color-mix(in srgb,var(--p) 14%,#fff),color-mix(in srgb,var(--s) 14%,#fff));display:grid;place-items:center;color:var(--p);font-size:40px;}
.hoja-body{padding:18px 20px 22px;}
.hoja-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.hoja h3{font-family:'DM Sans',sans-serif;font-size:20px;}
.hoja-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:6px 0 14px;}
.cerrar{border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex-shrink:0;}
.sub{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;margin:14px 0 8px;}

  width:24px;
  height:2px;
  border-radius:99px;
  margin-top:5px;
  background:linear-gradient(90deg,var(--p),var(--s));
  opacity:.75;
}

.btn-wa-top{
  padding:10px 16px;
  border:1px solid color-mix(in srgb,#fff 15%,var(--p));
  background:linear-gradient(135deg,var(--p),var(--s));
  box-shadow:0 12px 25px -15px color-mix(in srgb,var(--p) 75%,transparent);
}

.btn-wa-top i{
  font-size:18px;
}

/* Entrada del encabezado: el nombre llega suavemente desde la derecha */
.barra-top .marca{
  animation:headerMarca .72s cubic-bezier(.22,.75,.2,1) both;
}

.barra-top .marca strong{
  display:block;
  animation:nombreDesdeDerecha .82s cubic-bezier(.22,.75,.2,1) .04s both;
}

.barra-top .btn-wa-top{
  animation:headerBtn .62s cubic-bezier(.22,.75,.2,1) .10s both;
}

@keyframes headerMarca{
  from{opacity:0;transform:translateX(8px);}
  to{opacity:1;transform:none;}
}

@keyframes nombreDesdeDerecha{
  from{
    opacity:0;
    transform:translateX(34px);
  }
  70%{
    opacity:1;
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes headerBtn{
  from{opacity:0;transform:translateY(-4px) scale(.97);}
  to{opacity:1;transform:none;}
}

@media(max-width:560px){
  .barra-top{
    background:rgba(255,255,255,.96);
  }

  .barra-top .wrap{
    height:68px;
    padding:0 14px;
    gap:10px;
  }

  .marca{
    gap:10px;
    padding-left:3px;
  }

  .marca::before{
    left:-5px;
    width:3px;
    height:32px;
  }

  .marca img{
    width:46px;
    height:46px;
    border-width:1.5px;
  }

  .marca strong{
    font-size:19px;
    max-width:205px;
  }

  .marca strong::after{
    width:19px;
    height:2px;
    margin-top:4px;
  }

  .btn-wa-top{
    width:44px;
    height:44px;
    padding:0;
    border-radius:50%;
    display:grid;
    place-items:center;
    flex-shrink:0;
    box-shadow:0 9px 20px -12px color-mix(in srgb,var(--p) 75%,transparent);
  }

  .btn-wa-top i{
    font-size:20px;
  }
}
</style>

<body>

  <div class="wrap perfil-info">

  <span class="corazon-flotante" style="--x:57%;--y:25%;--size:15px;--dur:1.05s;--delay:.16s;--drift:24px;--rot:18deg;">♥</span>
  <span class="corazon-flotante" style="--x:36%;--y:30%;--size:13px;--dur:1.25s;--delay:.12s;--drift:-28px;--rot:-18deg;">♥</span>
  <span class="corazon-flotante" style="--x:63%;--y:31%;--size:18px;--dur:1.45s;--delay:.22s;--drift:30px;--rot:14deg;">♥</span>
  <span class="corazon-flotante" style="--x:47%;--y:22%;--size:12px;--dur:1.1s;--delay:.28s;--drift:-35px;--rot:-8deg;">♥</span>
  <span class="corazon-flotante" style="--x:54%;--y:23%;--size:14px;--dur:1.3s;--delay:.34s;--drift:38px;--rot:20deg;">♥</span>

<!-- Inscripción de clientes -->
<div class="ov" id="ov-club" onclick="if(event.target===this)cerrarInscripcion()">
  <div class="hoja" role="dialog" aria-modal="true" aria-label="Inscríbete">

</div>

<!-- Producto y pedido (pasos) -->
<div class="ov" id="ov-prod" onclick="if(event.target===this)cerrarProducto()">
  <div class="hoja" role="dialog" aria-modal="true" aria-label="Tu pedido">
    <div id="p-foto"></div>
    <div class="hoja-body" id="p-body"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script type="module" src="https://bt-cdn.yappy.cloud/v1/cdn/web-component-btn-yappy.js"></script>
<script src="/config.js"></script>
<script src="/pedidos.js?v=22"></script>
<script>
let CAT = { categorias: [], productos: [], zonas: [] };
let CAT_SEL = null;
let PROD = null;
const E = Pedidos.esc;

function estado(titulo, texto){
  document.getElementById('t-grid').innerHTML = '';
  document.getElementById('t-cats').innerHTML = '';
  const el = document.getElementById('t-estado');
  el.hidden = false;
  el.innerHTML = `<h2>${E(titulo)}</h2><p>${E(texto)}</p>`;
}

async function arrancar(){
  const slug = Pedidos.slugDeLaUrl();
  if (!slug){ estado('Tienda no encontrada', 'Revisa el link que te compartieron.'); document.getElementById('t-nombre').textContent = 'Annly Pedidos'; return; }
  let n;
  try { n = await Pedidos.cargarNegocioPorSlug(slug); } catch(e){ console.error(e); }
  if (!n || n.activo === false){ document.getElementById('t-nombre').textContent = 'Tienda no encontrada'; estado('Tienda no encontrada', 'Revisa el link que te compartieron.'); return; }
  if (n.tipo_negocio !== 'pedidos'){
    // Un negocio de citas: su agenda está en Annly
    window.location.replace(((window.PEDIDOS_CONFIG || {}).ANNLY_URL || 'https://annly.app') + '/' + encodeURIComponent(n.slug));
    return;
  }
  pintarNegocio(n);
  // Cuenta suspendida por falta de pago: la tienda queda en solo vista (sin pedidos)
  try {
    if (await Pedidos.negocioSuspendido()){
      annlyModoVista('Por el momento esta tienda no está recibiendo pedidos.');
      ['irPaso', 'enviarPedido', 'abrirInscripcion', 'enviarInscripcion'].forEach(nombre => {
        const f = window[nombre];
        if (typeof f === 'function') window[nombre] = function(){ alert('Por el momento esta tienda no está recibiendo pedidos.'); };
      });
    }
  } catch(e){ console.warn(e); }
  // Inscripción de clientes (módulo Programa de clientes, si la tienda lo activó)
  Pedidos.inscripcionClientesActiva().then(activa => { const c = document.getElementById('club-link'); if (activa && c) c.hidden = false; }).catch(() => {});
  // Catálogo, ofertas y promoción se piden a la vez (antes iban uno tras otro)
  let of = {}, promo = null, soloPromo = new Set();
  try {
    [CAT, of, promo, soloPromo] = await Promise.all([
      Pedidos.catalogo(),
      Pedidos.ofertas().catch(e => { console.error(e); return {}; }),
      Pedidos.promo().catch(() => null),
      Pedidos.soloPromo().catch(() => new Set())
    ]);
  }
  catch(e){ console.error(e); estado('No pudimos cargar el catálogo', 'Recarga la página en un momento.'); return; }
  if (!CAT.productos.length){ estado('Catálogo en preparación', 'Pronto podrás hacer tus pedidos aquí.'); return; }
  // Ofertas vigentes: el precio de oferta pasa a ser el precio (el servidor cobra lo mismo)
  // Productos "solo para promoción": se pueden pedir, pero no se listan en el catálogo
  CAT.productos.forEach(p => { p.soloPromo = soloPromo.has(p.id); });
  CAT.productos.forEach(p => { const o = of[p.id]; if (o && o.precio > 0 && o.precio < Number(p.precio)) { p.precioNormal = Number(p.precio); p.precio = o.precio; p.ofertaHasta = o.hasta; } });
  pintarEntregasPie();
  pintarPromoTienda(promo);
  completarPortada();
  pintarCategorias();
  pintarProductos();
}

function pintarNegocio(n){
  document.title = n.nombre + ' · Pedidos en línea';
  const r = document.documentElement.style;
  if (n.color_primario) r.setProperty('--p', n.color_primario);
  if (n.color_secundario) r.setProperty('--s', n.color_secundario);
  document.getElementById('t-nombre').textContent = n.nombre;
  if (n.logo_url){ const l = document.getElementById('t-logo'); l.src = n.logo_url; l.alt = n.nombre; l.hidden = false; }
  else document.getElementById('t-logo-ini').textContent = String(n.nombre || '?').trim().charAt(0).toUpperCase();
  pintarPortada(n);
  const wa = String(n.whatsapp || '').replace(/\D/g, '');
  const ig = String(n.instagram || '').replace(/^@+/, '');
  // El pie no repite el encabezado: solo dónde estamos, qué ofrecemos y cómo escribirnos
  const mapa = n.direccion ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(n.direccion + ', Panamá') : '';
  document.getElementById('t-pie-card').innerHTML =
    (n.direccion ? `<div class="pie-col"><div class="pie-ico"><i class="ti ti-map-pin"></i></div>
      <div><h4>Visítanos</h4><p>${E(n.direccion)}</p><a href="${mapa}" target="_blank" rel="noopener">Ver en el mapa →</a></div></div>
      <div class="pie-sep" aria-hidden="true"></div>` : '') +
    `<div class="pie-col"><div class="pie-ico"><i class="ti ti-truck-delivery"></i></div>
      <div><h4>Nuestros servicios</h4><p id="t-pie-entregas">Pedidos en línea</p></div></div>`;
  if (!n.direccion) document.getElementById('t-pie-card').style.gridTemplateColumns = '1fr';
  document.getElementById('t-pie-redes').innerHTML = (wa || ig) ? `<div class="pie-titulo">Escríbenos</div><div class="redes">` +
    (wa ? `<a class="red wa" href="https://wa.me/${wa}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i><span>WhatsApp</span><i class="ti ti-arrow-right"></i></a>` : '') +
    (ig ? `<a class="red ig" href="https://instagram.com/${E(ig)}" target="_blank" rel="noopener"><i class="ti ti-brand-instagram"></i><span>@${E(ig)}</span><i class="ti ti-arrow-right"></i></a>` : '') +
    `</div>` : '';
  if (!(wa && ig)) { const r = document.querySelector('.redes'); if (r) r.style.gridTemplateColumns = '1fr'; }
  document.getElementById('t-pie-copy').textContent = '© ' + new Date().getFullYear() + ' ' + n.nombre;
  const flot = document.getElementById('t-wa-flot');
  if (wa){ flot.href = 'https://wa.me/' + wa; flot.hidden = false; }
  document.getElementById('t-footer').hidden = false;
  // El botón flotante se esconde solo cuando el WhatsApp del pie ya está a la vista
  // (antes bastaba con que asomara el borde del pie, y con pocos productos nunca se veía)
  if ('IntersectionObserver' in window){
    const waPie = document.querySelector('#t-pie-redes .red.wa');
    if (waPie) new IntersectionObserver(ents => ents.forEach(en => flot.classList.toggle('oculto', en.isIntersecting)), { threshold: 0.6 })
      .observe(waPie);
  }
}

// ---------- Portada tipo perfil: logo, nombre, rubro y lema de cada negocio ----------
function pintarPortada(n){
  document.getElementById('t-eyebrow').textContent = n.categoria || 'Pedidos en línea';
  const frase = String(n.tagline || '').replace(/^[«"“'\s]+|[»"”'\s]+$/g, '').trim();
  const lema = document.getElementById('t-titulo');
  lema.textContent = frase ? '«' + frase + '»' : '';
  lema.hidden = !frase;
  armarCoverPortada(n);
  document.getElementById('t-portada').hidden = false;
}
// Foto de portada (solo la que eligió el negocio) o, sin foto, la franja suave; y su tinte.
// Se arma antes de mostrar la cabecera, así no hay un salto de un tono a otro al cargar.
function armarCoverPortada(n){
  const box = document.getElementById('t-portada-foto');
  const viejo = box.querySelector('img'); if (viejo) viejo.remove();
  box.classList.toggle('sin-foto', !n.portada_url);
  if (n.portada_url) box.insertAdjacentHTML('afterbegin', `<img src="${E(n.portada_url)}" alt="">`);
  const velo = box.querySelector('.perfil-velo');
  if (velo) velo.style.opacity = String(Math.min(80, Math.max(0, Number(n.portada_velo ?? 5))) / 100);
}
// Datos de la tienda y foto de portada, cuando ya se cargó el catálogo
function completarPortada(){
  const c = { retiro: true, domicilio: true, ...((CAT && CAT.config) || {}) };
  const n = Pedidos.negocio || {};
  const items = [];
  // [ícono, texto completo, texto corto para el celular]
  if (c.domicilio) items.push(['ti-truck-delivery', 'Entrega a domicilio', 'A domicilio']);
  if (c.retiro) items.push(['ti-building-store', 'Retiro en tienda', 'Retiro en tienda']);
  const yappy = !!n.yappy_numero, banco = !!(n.banco_nombre && n.banco_numero_cuenta);
  if (yappy || banco) items.push(['ti-device-mobile',
    'Paga con ' + [yappy ? 'Yappy' : null, banco ? 'transferencia' : null].filter(Boolean).join(' o '),
    yappy && banco ? 'Yappy o transf.' : (yappy ? 'Paga con Yappy' : 'Transferencia')]);
  const bens = document.getElementById('t-beneficios');
  bens.innerHTML = items.map(i => `<div class="perfil-ben"><i class="ti ${i[0]}"></i><b><span class="ben-largo">${E(i[1])}</span><span class="ben-corto">${E(i[2])}</span></b></div>`).join('');

}

// Formas de entrega en el pie (cuando ya se cargó el catálogo)
function pintarEntregasPie(){
  const el = document.getElementById('t-pie-entregas');
  if (!el) return;
  const c = { retiro: true, domicilio: true, ...((CAT && CAT.config) || {}) };
  const txt = c.retiro && c.domicilio ? 'Retiro en tienda y entrega a domicilio' : (c.domicilio ? 'Entrega a domicilio' : 'Retiro en tienda');
  el.innerHTML = c.retiro && c.domicilio ? 'Retiro en tienda<br>y entrega a domicilio' : E(txt);
}


function pintarCategorias(){
  const usadas = CAT.categorias.filter(c => CAT.productos.some(p => p.categoriaId === c.id && !p.soloPromo));
  const cats = [{ id: null, nombre: 'Todo' }, ...usadas];
  document.getElementById('t-cats').innerHTML = cats.length > 2 ? cats.map(c =>
    `<button class="cat${c.id === CAT_SEL ? ' on' : ''}" role="tab" aria-selected="${c.id === CAT_SEL}" onclick="elegirCategoria(${c.id ? `'${c.id}'` : 'null'})">${E(c.nombre)}</button>`).join('') : '';
}
function elegirCategoria(id){ CAT_SEL = id; pintarCategorias(); pintarProductos(); }

function fotoHtml(p, clase){
  return p.foto ? `<img class="${clase}" src="${E(p.foto)}" alt="${E(p.nombre)}" loading="lazy">` : `<div class="${clase}"><i class="ti ti-flower"></i></div>`;
}

// Precio con oferta: normal tachado + precio de oferta
const descuento = p => Math.round((1 - p.precio / p.precioNormal) * 100);
function precioHtml(p){
  return p.precioNormal
    ? `<b class="precio-oferta"><s>${Pedidos.dinero(p.precioNormal)}</s> ${Pedidos.dinero(p.precio)}</b>`
    : `<b>${Pedidos.dinero(p.precio)}</b>`;
}

// ---- Promoción destacada (banner al inicio del catálogo) ----
const TEMAS_P = {
  fiesta:  { emoji: '🎉', fondo: 'linear-gradient(135deg,#A89BD9,#7A6AB5)', conf: ['#FFD166','#FF6B9A','#7BDFF2','#FFFFFF','#B8F2A0'], formas: ['■','●','▲'] },
  corazon: { emoji: '💝', fondo: 'linear-gradient(135deg,#F0A8B8,#D67D95)', conf: ['#FFFFFF','#FFD1DC','#E1306C','#FF8FAB'], formas: ['❤','●','❤'] },
  regalo:  { emoji: '🎁', fondo: 'linear-gradient(135deg,#E9B872,#C98B3C)', conf: ['#FFFFFF','#FFE29A','#E1306C','#8E5BD9'], formas: ['■','●','★'] },
  flores:  { emoji: '🌸', fondo: 'linear-gradient(135deg,#F2A7C3,#B0679E)', conf: ['#FFFFFF','#FFD1E8','#FFE29A','#C8F0D2'], formas: ['✿','●','❀'] }
};
function pintarPromoTienda(pr){
  const box = document.getElementById('t-promo');
  if (!box) return;
  const prod = pr && pr.activa && pr.producto_id ? CAT.productos.find(p => p.id === pr.producto_id) : null;
  if (!prod){ box.hidden = true; box.innerHTML = ''; return; }
  const t = TEMAS_P[pr.tema] || TEMAS_P.fiesta;
  box.style.background = t.fondo;
  box.innerHTML = `
    <div class="promo-txt">
      <span class="promo-etq">${t.emoji} ${E(pr.etiqueta || 'PROMOCIÓN')}</span>
      <h2>${E(pr.festejo || '¡Oferta especial!')}</h2>
      <p class="promo-prod">${E(prod.nombre)}</p>
      <p class="promo-precio">${prod.precioNormal ? `<s>${Pedidos.dinero(prod.precioNormal)}</s> ` : ''}<b>${Pedidos.dinero(prod.precio)}</b>${prod.precioNormal ? ` <span>-${descuento(prod)}%</span>` : ''}</p>
      ${pr.vigencia ? `<p class="promo-vig">${E(pr.vigencia)}</p>` : ''}
      <button class="promo-cta" onclick="abrirProducto('${prod.id}')">Lo quiero <i class="ti ti-arrow-right"></i></button>
    </div>
    ${prod.foto ? `<img class="promo-foto" src="${E(prod.foto)}" alt="${E(prod.nombre)}">` : `<div class="promo-foto promo-emoji">${t.emoji}</div>`}
    <div class="promo-brillo" aria-hidden="true"></div>
    <div class="promo-confeti" aria-hidden="true"></div>`;
  box.hidden = false;
  box.classList.remove('entra'); void box.offsetWidth; box.classList.add('entra');
  lanzarConfetiPromo(box, t);
  // Al tocar la etiqueta, otra lluvia de confeti
  box.querySelector('.promo-etq').onclick = () => lanzarConfetiPromo(box, t);
}

// Confeti que cae dentro del banner (respeta "reducir movimiento" del teléfono)
function lanzarConfetiPromo(box, t){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const capa = box.querySelector('.promo-confeti');
  if (!capa) return;
  capa.innerHTML = '';
  const n = window.innerWidth < 560 ? 34 : 54;
  for (let i = 0; i < n; i++){
    const c = document.createElement('i');
    c.textContent = t.formas[i % t.formas.length];
    c.style.left = (Math.random() * 100) + '%';
    c.style.color = t.conf[i % t.conf.length];
    c.style.fontSize = (9 + Math.random() * 10) + 'px';
    c.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (0.25 + Math.random() * 0.9) + 's';
    capa.appendChild(c);
  }
  setTimeout(() => { capa.innerHTML = ''; }, 4600);
}

function pintarProductos(){
  const lista = CAT.productos.filter(p => !p.soloPromo && (!CAT_SEL || p.categoriaId === CAT_SEL));
  document.getElementById('t-estado').hidden = true;
  document.getElementById('t-grid').innerHTML = lista.map((p, i) => `
    <button class="prod" style="animation-delay:${Math.min(i, 11) * 60}ms" onclick="abrirProducto('${p.id}')">
      <div class="prod-foto-wrap">${fotoHtml(p, 'prod-foto')}${p.precioNormal ? `<span class="hablador">-${descuento(p)}%</span>` : ''}</div>
      <div class="prod-info"><strong>${E(p.nombre)}</strong>${p.descripcion ? `<span>${E(p.descripcion)}</span>` : ''}${precioHtml(p)}</div>
    </button>`).join('');
}

// ================= PEDIDO: pasos =================
// 1 producto y extras · 2 fecha y franja · 3 entrega · 4 datos · 5 pago · 6 listo
const PED = {};
const CFG_DEF = { minPrepHoras: 3, avisoHoras: 24, maxDias: 60, retiro: true, domicilio: true };
const cfg = () => ({ ...CFG_DEF, ...(CAT.config || {}) });
const PASOS = 5;

function nuevoPedido(prod){
  Object.assign(PED, { paso: 1, prod, pagoTipo: null, extras: new Set(), fecha: null, franja: null, franjas: [],
    entrega: null, zonaId: null, fueraZona: false, direccion: '', referencia: '',
    cliente: { nombre: '', telefono: '', correo: '' }, destinatario: { nombre: '', telefono: '' }, mismo: false,
    dedicatoria: '', comprobante: '', resultado: null });
  const c = cfg();
  if (c.retiro && !c.domicilio) PED.entrega = 'retiro';
  if (!c.retiro && c.domicilio) PED.entrega = 'domicilio';
}

function abrirProducto(id){
  const prod = CAT.productos.find(p => p.id === id);
  if (!prod) return;
  nuevoPedido(prod);
  document.getElementById('p-foto').innerHTML = fotoHtml(prod, 'hoja-foto');
  pintarPaso();
  document.getElementById('ov-prod').classList.add('on');
}
function cerrarProducto(){ if (PED._aislado) return; document.getElementById('ov-prod').classList.remove('on'); document.getElementById('celebracion')?.classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarProducto(); });

// ---- Montos (solo para mostrar; el total real lo calcula la base al crear el pedido) ----
function extrasElegidos(){ return PED.prod.extras.filter(x => PED.extras.has(x.id)); }
function zonaElegida(){ return (CAT.zonas || []).find(z => z.id === PED.zonaId) || null; }
function montos(){
  const extras = extrasElegidos().reduce((s, x) => s + Number(x.precio), 0);
  const envio = PED.entrega === 'domicilio' && !PED.fueraZona && zonaElegida() ? Number(zonaElegida().precio) : 0;
  return { producto: Number(PED.prod.precio), extras, envio, total: Number(PED.prod.precio) + extras + envio,
           envioPendiente: PED.entrega === 'domicilio' && PED.fueraZona };
}

function barraPasos(){
  return `<div class="pasos" aria-hidden="true">${Array.from({ length: PASOS }, (_, i) => `<span class="${i < PED.paso ? 'on' : ''}"></span>`).join('')}</div>`;
}
function botonVolver(){ return PED.paso > 1 ? `<button class="volver" onclick="irPaso(${PED.paso - 1})"><i class="ti ti-chevron-left"></i> Volver</button>` : ''; }
function irPaso(n){ restaurarYappy(); PED.paso = n; pintarPaso(); document.querySelector('#ov-prod .hoja').scrollTop = 0; if(n === 6) setTimeout(lanzarCelebracion, 120); }

function pintarPaso(){
  document.getElementById('p-foto').style.display = PED.paso === 1 ? '' : 'none';
  const cuerpo = { 1: paso1, 2: paso2, 3: paso3, 4: paso4, 5: paso5, 6: paso6 }[PED.paso]();
  document.getElementById('p-body').innerHTML = (PED.paso <= PASOS ? barraPasos() : '') + cuerpo;
  if (PED.paso === 2 && PED.fecha) cargarFranjas();
  if (PED.paso === 5 && PED.metodo === 'yappy_real') conectarYappyPedido();
}

// ---- 1. Producto y extras ----
function paso1(){
  const p = PED.prod;
  return `<div class="hoja-top"><h3>${E(p.nombre)}</h3><button class="cerrar" onclick="cerrarProducto()" aria-label="Cerrar">×</button></div>
    ${p.descripcion ? `<p class="hoja-desc">${E(p.descripcion)}</p>` : ''}
    ${p.precioNormal ? `<div class="hoja-oferta"><span class="hablador" style="position:static;transform:none;">-${descuento(p)}%</span> <s>${Pedidos.dinero(p.precioNormal)}</s> <b>${Pedidos.dinero(p.precio)}</b>${p.ofertaHasta ? ` <small>hasta el ${fechaLarga(p.ofertaHasta)}</small>` : ''}</div>` : ''}
    ${p.extras.length ? '<div class="sub">Agrégale algo especial</div>' + p.extras.map(x => `
      <label class="extra"><input type="checkbox" ${PED.extras.has(x.id) ? 'checked' : ''} onchange="toggleExtra('${x.id}', this.checked)"><span>${E(x.nombre)}</span><b>+${Pedidos.dinero(x.precio)}</b></label>`).join('') : ''}
    <div class="total"><span>Total</span><b id="p-total">${Pedidos.dinero(montos().total)}</b></div>
    <button class="btn-pedir" onclick="irPaso(2)">Elegir fecha y entrega</button>`;
}
function toggleExtra(id, on){
  if (on) PED.extras.add(id); else PED.extras.delete(id);
  document.getElementById('p-total').textContent = Pedidos.dinero(montos().total);
}

// ---- 2. Fecha y franja ----
const DIAS_CORTOS = ['dom','lun','mar','mié','jue','vie','sáb'];
function isoDe(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hora12(t){ const [h, m] = String(t).split(':').map(Number); return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' p.m.' : ' a.m.'); }
function fechaLarga(iso){ return new Date(iso + 'T12:00:00').toLocaleDateString('es-PA', { weekday: 'long', day: 'numeric', month: 'long' }); }

function paso2(){
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  const n = Math.min(cfg().maxDias || 60, 21);
  const dias = Array.from({ length: n + 1 }, (_, i) => { const d = new Date(hoy); d.setDate(hoy.getDate() + i); return d; });
  return `${botonVolver()}<div class="paso-tit">¿Para cuándo?</div>
    <p class="paso-sub">Elige el día y la franja en que lo quieres recibir o retirar.</p>
    <div class="dias" role="listbox" aria-label="Día">${dias.map(d => { const iso = isoDe(d); return `
      <button class="dia${PED.fecha === iso ? ' on' : ''}" role="option" aria-selected="${PED.fecha === iso}" onclick="elegirFecha('${iso}')">
        <small>${d.toDateString() === new Date().toDateString() ? 'hoy' : DIAS_CORTOS[d.getDay()]}</small><b>${d.getDate()}</b>
      </button>`; }).join('')}</div>
    <div id="p-franjas">${PED.fecha ? '<p class="nota">Buscando horarios…</p>' : '<p class="nota" style="margin-top:14px;">Elige un día para ver los horarios.</p>'}</div>
    <p class="err" id="p-err2"></p>
    <button class="btn-pedir" ${PED.franja ? '' : 'disabled'} onclick="irPaso(3)">Continuar</button>`;
}
function elegirFecha(iso){ PED.fecha = iso; PED.franja = null; pintarPaso(); }
async function cargarFranjas(){
  const cont = document.getElementById('p-franjas');
  try { PED.franjas = await Pedidos.franjas(PED.fecha); }
  catch(e){ cont.innerHTML = `<p class="err">${E(e.message)}</p>`; return; }
  const libres = PED.franjas.filter(f => f.disponible);
  if (!PED.franjas.length){ cont.innerHTML = '<p class="nota" style="margin-top:14px;">Ese día no hay entregas. Prueba con otro día.</p>'; return; }
  cont.innerHTML = `<div class="franjas">${PED.franjas.map(f => `
    <button class="fr${PED.franja && PED.franja.id === f.id ? ' on' : ''}" ${f.disponible ? '' : 'disabled'} onclick="elegirFranja('${f.id}')">
      <b>${hora12(f.inicio)} – ${hora12(f.fin)}</b>
      <small>${!f.disponible ? (f.libres > 0 ? 'Muy pronto para prepararlo' : 'Sin cupo') : (f.libres <= 2 ? `Quedan ${f.libres}` : 'Disponible')}</small>
    </button>`).join('')}</div>
    ${!libres.length ? '<p class="nota" style="margin-top:10px;">Ese día ya no tenemos cupo. Prueba con otro día.</p>' : ''}
    ${PED.franja && PED.franja.pocaAnticipacion ? '<div class="aviso">Es poco tiempo: haremos lo posible por tenerlo listo. Si algo cambia, te avisamos por WhatsApp.</div>' : ''}`;
}
function elegirFranja(id){ PED.franja = PED.franjas.find(f => f.id === id) || null; pintarPaso(); }

// ---- 3. Entrega ----
function paso3(){
  const c = cfg(), zonas = CAT.zonas || [];
  const opcion = (val, tit, txt) => `<label class="opc${PED.entrega === val ? ' on' : ''}"><input type="radio" name="entrega" ${PED.entrega === val ? 'checked' : ''} onchange="elegirEntrega('${val}')"><div><strong>${tit}</strong><span>${txt}</span></div></label>`;
  const dir = (Pedidos.negocio && Pedidos.negocio.direccion) || '';
  let dom = '';
  if (PED.entrega === 'domicilio'){
    dom = `<div class="fg" style="margin-top:6px;"><label class="flbl" for="p-zona">Zona de entrega</label>
      <select class="fi" id="p-zona" onchange="elegirZona(this.value)">
        <option value="">Elige tu zona…</option>
        ${zonas.map(z => `<option value="${z.id}"${PED.zonaId === z.id ? ' selected' : ''}>${E(z.nombre)} · ${Pedidos.dinero(z.precio)}</option>`).join('')}
        <option value="fuera"${PED.fueraZona ? ' selected' : ''}>Mi zona no aparece</option>
      </select></div>
      ${PED.fueraZona ? '<div class="aviso">Tu zona está fuera de nuestra cobertura habitual. Te confirmaremos el costo del envío por WhatsApp antes de preparar tu pedido.</div>' : ''}
      <div class="fg"><label class="flbl" for="p-dir">Dirección de entrega</label><input class="fi" id="p-dir" maxlength="200" value="${E(PED.direccion)}" placeholder="Calle, edificio, apartamento"></div>
      <div class="fg"><label class="flbl" for="p-ref">Punto de referencia (opcional)</label><input class="fi" id="p-ref" maxlength="160" value="${E(PED.referencia)}" placeholder="Frente al parque, casa azul…"></div>`;
  }
  return `${botonVolver()}<div class="paso-tit">¿Cómo lo recibes?</div>
    <p class="paso-sub">${fechaLarga(PED.fecha)} · ${hora12(PED.franja.inicio)} – ${hora12(PED.franja.fin)}</p>
    ${c.retiro ? opcion('retiro', 'Retiro en tienda', dir ? E(dir) : 'Pasas a buscarlo en la franja elegida.') : ''}
    ${c.domicilio ? opcion('domicilio', 'Entrega a domicilio', 'Lo llevamos a la dirección que indiques.') : ''}
    ${dom}
    <p class="err" id="p-err"></p>
    <button class="btn-pedir" onclick="validarEntrega()">Continuar</button>`;
}
function guardarDireccion(){
  const d = document.getElementById('p-dir'), r = document.getElementById('p-ref');
  if (d) PED.direccion = d.value; if (r) PED.referencia = r.value;
}
function elegirEntrega(v){ guardarDireccion(); PED.entrega = v; pintarPaso(); }
function elegirZona(v){ guardarDireccion(); PED.fueraZona = v === 'fuera'; PED.zonaId = v && v !== 'fuera' ? v : null; pintarPaso(); }
function validarEntrega(){
  guardarDireccion();
  const err = document.getElementById('p-err');
  if (!PED.entrega){ err.textContent = 'Elige cómo quieres recibir tu pedido.'; return; }
  if (PED.entrega === 'domicilio'){
    if (!PED.zonaId && !PED.fueraZona){ err.textContent = 'Elige tu zona de entrega.'; return; }
    if (!PED.direccion.trim()){ err.textContent = 'Escribe la dirección de entrega.'; return; }
  }
  irPaso(4);
}

// ---------- Inscripción de clientes ----------
function abrirInscripcion(){
  const nombreNegocio = (Pedidos.negocio && Pedidos.negocio.nombre) || 'esta tienda';

    <p class="err" id="insc-msg"></p>
    <button class="btn-pedir" id="btnInscripcion" onclick="enviarInscripcion()">Inscribirme</button>`;
  document.getElementById('ov-club').classList.add('on');
}
function cerrarInscripcion(){ document.getElementById('ov-club').classList.remove('on'); }
async function enviarInscripcion(){
  const msg = document.getElementById('insc-msg'), btn = document.getElementById('btnInscripcion');
  const v = id => ((document.getElementById(id) || {}).value || '').trim();
  if (v('insc-web')) return; // trampa para programas automáticos
  const nombre = v('insc-nombre'), telefono = v('insc-telefono'), correo = v('insc-correo');
  const dia = parseInt(v('insc-dia'), 10) || null, mes = parseInt(v('insc-mes'), 10) || null;
  if (nombre.length < 2){ msg.textContent = 'Escribe tu nombre.'; return; }
  if (telefono.replace(/\D/g, '').length < 7){ msg.textContent = 'Escribe tu número de WhatsApp.'; return; }
  if (correo && !/^\S+@\S+\.\S+$/.test(correo)){ msg.textContent = 'Revisa tu correo.'; return; }
  if ((dia && !mes) || (!dia && mes)){ msg.textContent = 'Elige el día y el mes de tu cumpleaños, o deja los dos vacíos.'; return; }
  if (!document.getElementById('insc-acepta').checked){ msg.textContent = 'Marca la casilla para poder inscribirte.'; return; }
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const r = await Pedidos.inscribirCliente({ nombre, telefono, correo, cumpleDia: dia, cumpleMes: mes, acepta: true });
    if (!r || !r.ok){
      const errores = { cumple: 'Revisa la fecha de tu cumpleaños.', correo: 'Revisa tu correo.', telefono: 'Revisa tu número de WhatsApp.', nombre: 'Escribe tu nombre.', no_disponible: 'Por ahora no está disponible la inscripción.' };
      msg.textContent = errores[r && r.error] || 'No se pudo completar la inscripción. Intenta de nuevo.';
      btn.disabled = false; btn.textContent = 'Inscribirme'; return;
    }
    document.getElementById('club-body').innerHTML = `
      <div style="text-align:center;padding:1.2rem .5rem 1rem;">
        <div style="width:54px;height:54px;border-radius:50%;background:color-mix(in srgb,var(--p) 14%,#fff);color:var(--p);display:grid;place-items:center;font-size:26px;margin:0 auto 14px;"><i class="ti ti-check"></i></div>
        <div style="font-size:18px;font-weight:700;margin-bottom:6px;">¡Listo, ya estás inscrito(a)!</div>
        <p class="hoja-desc" style="margin:0 0 6px;">Gracias por unirte. Pronto sabrás de nuestras promociones y sorpresas.</p>
        <button class="btn-pedir" onclick="cerrarInscripcion()">Cerrar</button>
      </div>`;
  } catch(e){
    console.error(e);
    msg.textContent = 'No se pudo completar la inscripción. Intenta de nuevo.';
    btn.disabled = false; btn.textContent = 'Inscribirme';
  }
}

function leerDatos(){
  const v = id => (document.getElementById(id) || {}).value || '';
  PED.cliente = { nombre: v('c-nom').trim(), telefono: v('c-tel').trim(), correo: v('c-mail').trim() };
  PED.destinatario = PED.mismo ? { nombre: PED.cliente.nombre, telefono: PED.cliente.telefono } : { nombre: v('d-nom').trim(), telefono: v('d-tel').trim() };
  PED.dedicatoria = v('p-ded');
}
function mismoQueRecibe(on){ leerDatos(); PED.mismo = on; pintarPaso(); }
function validarDatos(){
  leerDatos();
  const err = document.getElementById('p-err');
  if (!PED.cliente.nombre){ err.textContent = 'Escribe tu nombre.'; return; }
  if (PED.cliente.telefono.replace(/\D/g, '').length < 7){ err.textContent = 'Escribe un WhatsApp válido.'; return; }
  if (PED.cliente.correo && !/^\S+@\S+\.\S+$/.test(PED.cliente.correo)){ err.textContent = 'Revisa tu correo.'; return; }
  if (!PED.destinatario.nombre){ err.textContent = 'Escribe el nombre de quien recibe el pedido.'; return; }
  irPaso(5);
}

// ---- 5. Resumen y pago ----
// Medios de pago del negocio: Yappy y/o transferencia bancaria
function mediosPago(){
  const n = Pedidos.negocio || {};
  const m = [];
  if (n.tiene_yappy_comercial) m.push('yappy_real');   // botón oficial de Yappy (módulo Pagos en línea)
  if (n.yappy_numero) m.push('yappy');
  if (n.banco_nombre && n.banco_numero_cuenta && n.banco_titular) m.push('transferencia');
  return m;
}
// Abono: la tienda define un monto fijo; solo se ofrece si el pedido cuesta más que eso
function abonoDisponible(m){
  const a = Number((Pedidos.negocio || {}).abono_pedido) || 0;
  return a > 0 && m.total > a ? a : 0;
}
function montoAPagar(m){
  const a = abonoDisponible(m);
  return PED.pagoTipo === 'abono' && a ? a : m.total;
}
function elegirPagoTipo(v){
  const comp = document.getElementById('p-comp');
  if (comp) PED.comprobante = comp.value;
  PED.pagoTipo = v; pintarPaso();
}

function paso5(){
  const m = montos(), n = Pedidos.negocio || {};
  const medios = mediosPago();
  const abono = abonoDisponible(m);
  if (!abono) PED.pagoTipo = 'total';
  else if (!PED.pagoTipo) PED.pagoTipo = 'total';
  const aPagar = montoAPagar(m);
  if (!PED.metodo || !medios.includes(PED.metodo)) PED.metodo = medios[0] || null;
  const zona = zonaElegida();
  const filas = [
    [E(PED.prod.nombre), Pedidos.dinero(m.producto)],
    ...extrasElegidos().map(x => ['+ ' + E(x.nombre), Pedidos.dinero(x.precio)]),
    PED.entrega === 'domicilio' ? ['Envío' + (zona && !PED.fueraZona ? ' · ' + E(zona.nombre) : ''), m.envioPendiente ? 'Por confirmar' : Pedidos.dinero(m.envio)] : ['Retiro en tienda', 'Gratis']
  ];
  const opcion = (val, tit, txt) => `<label class="opc${PED.metodo === val ? ' on' : ''}"><input type="radio" name="metodo" ${PED.metodo === val ? 'checked' : ''} onchange="elegirMetodo('${val}')"><div><strong>${tit}</strong><span>${txt}</span></div></label>`;
  let detalle = '';
  if (PED.metodo === 'yappy_real'){
    const aliasIni = PED.alias != null ? PED.alias : String((PED.cliente && PED.cliente.telefono) || '').replace(/\D/g, '').replace(/^507(?=\d{8}$)/, '');
    detalle = `<div class="yappy" style="flex-direction:column;align-items:stretch;gap:8px;">
        <span class="nota" style="text-align:left;margin:0;">Escribe tu número de Yappy y toca el botón: aprobarás ${Pedidos.dinero(aPagar)} en tu app.</span>
        <input class="fi" id="p-alias" inputmode="numeric" maxlength="12" autocomplete="tel" value="${E(aliasIni)}" placeholder="Tu número Yappy (8 dígitos, sin +507)">
        <btn-yappy id="p-btn-yappy" theme="darkBlue" rounded="true"></btn-yappy>
        <p class="err" id="p-yappy-msg" style="margin:0;"></p></div>`;
  } else if (PED.metodo === 'yappy'){
    detalle = `<div class="yappy"><div><span class="nota" style="display:block;text-align:left;margin:0;">Envía ${Pedidos.dinero(aPagar)} al número</span><b>${E(n.yappy_numero)}</b></div>
        <button class="copiar" onclick="copiarDato(this, '${String(n.yappy_numero).replace(/\D/g, '')}')">Copiar</button></div>`;
  } else if (PED.metodo === 'transferencia'){
    detalle = `<div class="yappy" style="flex-direction:column;align-items:stretch;gap:6px;">
        <span class="nota" style="text-align:left;margin:0;">Transfiere ${Pedidos.dinero(aPagar)} a esta cuenta e incluye tu nombre en la referencia:</span>
        <div style="font-size:13.5px;line-height:1.6;"><b style="font-size:14px;">${E(n.banco_nombre)}</b>${n.banco_tipo_cuenta ? ' · ' + E(n.banco_tipo_cuenta) : ''}<br>
          Cuenta: <b style="font-size:14px;">${E(n.banco_numero_cuenta)}</b><br>Titular: ${E(n.banco_titular)}</div>
        <button class="copiar" style="align-self:flex-start;" onclick="copiarDato(this, '${E(String(n.banco_numero_cuenta).replace(/'/g, ''))}')">Copiar número de cuenta</button></div>`;
  }
  return `${botonVolver()}<div class="paso-tit">Confirma y paga</div>
    <p class="paso-sub">${fechaLarga(PED.fecha)} · ${hora12(PED.franja.inicio)} – ${hora12(PED.franja.fin)}<br>Para ${E(PED.destinatario.nombre)}</p>
    <div class="resumen">${filas.map(f => `<div><span>${f[0]}</span><span>${f[1]}</span></div>`).join('')}
      <div class="tot"><span>Total</span><span>${Pedidos.dinero(m.total)}</span></div></div>
    ${m.envioPendiente ? '<div class="aviso">El costo del envío se confirma por WhatsApp y se paga aparte.</div>' : ''}
    ${abono && medios.length ? `<div class="sub">¿Cuánto pagas ahora?</div>
      <label class="opc${PED.pagoTipo === 'total' ? ' on' : ''}"><input type="radio" name="pagotipo" ${PED.pagoTipo === 'total' ? 'checked' : ''} onchange="elegirPagoTipo('total')"><div><strong>Pagar todo · ${Pedidos.dinero(m.total)}</strong><span>Tu pedido queda pagado.</span></div></label>
      <label class="opc${PED.pagoTipo === 'abono' ? ' on' : ''}"><input type="radio" name="pagotipo" ${PED.pagoTipo === 'abono' ? 'checked' : ''} onchange="elegirPagoTipo('abono')"><div><strong>Dejar un abono · ${Pedidos.dinero(abono)}</strong><span>Pagas los ${Pedidos.dinero(m.total - abono)} restantes al recibir tu pedido.</span></div></label>` : ''}
    ${medios.length ? `<div class="sub">¿Cómo pagas${abono ? ' ' + Pedidos.dinero(aPagar) : ''}?</div>
      ${medios.includes('yappy_real') ? opcion('yappy_real', 'Yappy · pago automático', 'Aprueba el pago en tu app y tu pedido se confirma solo.') : ''}
      ${medios.includes('yappy') ? opcion('yappy', medios.includes('yappy_real') ? 'Yappy · enviar al número' : 'Yappy', 'Pago inmediato desde tu app.') : ''}
      ${medios.includes('transferencia') ? opcion('transferencia', 'Transferencia bancaria', E(n.banco_nombre)) : ''}
      ${detalle}
      ${PED.metodo === 'yappy_real' ? '' : `<div class="fg"><label class="flbl" for="p-comp">${PED.metodo === 'transferencia' ? 'Número de referencia de la transferencia' : 'Número de comprobante de Yappy'}</label><input class="fi" id="p-comp" maxlength="60" value="${E(PED.comprobante)}" placeholder="${PED.metodo === 'transferencia' ? 'Lo encuentras en tu banca en línea' : 'Lo encuentras en el detalle del pago'}"></div>`}`
    : '<div class="aviso info">Este negocio coordinará el pago contigo por WhatsApp al confirmar tu pedido.</div>'}
    <p class="err" id="p-err"></p>
    ${PED.metodo === 'yappy_real' ? '' : '<button class="btn-pedir" id="p-enviar" onclick="enviarPedido()">Enviar pedido</button>'}
    <p class="nota">${PED.metodo === 'yappy_real' ? 'Tu pedido se confirma solo cuando Yappy aprueba el pago.' : 'Tu pedido queda reservado y el negocio confirma el pago.'}</p>`;
}
function elegirMetodo(v){
  const comp = document.getElementById('p-comp');
  if (comp) PED.comprobante = comp.value;
  PED.metodo = v; pintarPaso();
}
function copiarDato(btn, dato){
  const antes = btn.textContent;
  navigator.clipboard.writeText(dato).then(() => { btn.textContent = '¡Copiado!'; setTimeout(() => { btn.textContent = antes; }, 1600); });
}
async function enviarPedido(){
  const err = document.getElementById('p-err'), btn = document.getElementById('p-enviar');
  const comp = document.getElementById('p-comp');
  PED.comprobante = comp ? comp.value.trim() : '';
  if (comp && !PED.comprobante){ err.textContent = PED.metodo === 'transferencia' ? 'Escribe el número de referencia de tu transferencia.' : 'Escribe el número de comprobante de tu pago por Yappy.'; return; }
  btn.disabled = true; btn.textContent = 'Enviando…'; err.textContent = '';
  try {
    PED.resultado = await Pedidos.crearPedido({
      productId: PED.prod.id,
      extras: extrasElegidos().map(x => ({ itemId: x.id, qty: 1 })),
      fecha: PED.fecha, slotId: PED.franja.id, entrega: PED.entrega,
      zonaId: PED.entrega === 'domicilio' && !PED.fueraZona ? PED.zonaId : null,
      direccion: PED.entrega === 'domicilio' ? PED.direccion : null,
      referencia: PED.entrega === 'domicilio' ? PED.referencia : null,
      cliente: PED.cliente, destinatario: PED.destinatario, dedicatoria: PED.dedicatoria,
      pago: { metodo: PED.metodo || 'yappy', comprobante: PED.comprobante || null },
      pagoTipo: PED.pagoTipo === 'abono' ? 'abono' : 'total'
    });
    irPaso(6);
  } catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Enviar pedido';
    // Si la franja se llenó mientras tanto, se vuelve a elegir
    if (/franja|preparar/i.test(e.message)){ PED.franja = null; setTimeout(() => irPaso(2), 1800); }
  }
}

// ---- Pago automático con Yappy Comercial ----
// Mientras la ventana de Yappy está abierta, el resto del pedido se oculta para que no se encime ni se desordene.
// Siempre queda un botón "Volver al pedido" por si el cliente cierra la ventana de Yappy sin pagar.
function aislarYappy(btn){
  const ov = document.getElementById('ov-prod'), hoja = ov && ov.querySelector('.hoja');
  if (!hoja || !ov || PED._aislado) return;
  PED._aislado = [];
  let nodo = btn;
  while (nodo && nodo !== hoja){
    const padre = nodo.parentElement;
    if (!padre) break;
    [...padre.children].forEach(h => { if (h !== nodo) PED._aislado.push([h, h.style.visibility, null]); });
    PED._aislado.push([padre, null, padre.style.cssText]);
    nodo = padre;
  }
  PED._aislado.forEach(([el, vis, css]) => {
    if (vis !== null) el.style.visibility = 'hidden';
    else { el.style.background = 'transparent'; el.style.borderColor = 'transparent'; el.style.boxShadow = 'none'; }
  });
  hoja.style.overflow = 'visible';
  const v = document.createElement('button');
  v.id = 'yappy-volver'; v.type = 'button'; v.textContent = '← Volver a mi pedido';
  v.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;border:0;border-radius:999px;padding:10px 18px;font:700 13px DM Sans,sans-serif;background:#fff;color:#1F1B2B;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;';
  v.onclick = () => { restaurarYappy(); const m = document.getElementById('p-yappy-msg'); if (m) m.textContent = ''; };
  ov.appendChild(v);
  clearTimeout(PED._aisladoT); PED._aisladoT = setTimeout(restaurarYappy, 6 * 60 * 1000);
}
function restaurarYappy(){
  if (!PED._aislado) return;
  PED._aislado.forEach(([el, vis, css]) => { if (vis !== null) el.style.visibility = vis; else el.style.cssText = css; });
  const hoja = document.querySelector('#ov-prod .hoja'); if (hoja) hoja.style.overflow = '';
  PED._aislado = null; clearTimeout(PED._aisladoT);
  const v = document.getElementById('yappy-volver'); if (v) v.remove();
}
// El pedido se crea al tocar el botón (queda pendiente) y SOLO se confirma cuando Yappy avisa al servidor.
function conectarYappyPedido(){
  const btn = document.getElementById('p-btn-yappy');
  if (!btn || btn.dataset.listo) return;
  btn.dataset.listo = '1';
  const msg = (t, ok) => { const e = document.getElementById('p-yappy-msg'); if (e){ e.style.color = ok ? '#5a5a66' : ''; e.textContent = t || ''; } };
  const alias = () => String((document.getElementById('p-alias') || {}).value || '').replace(/\D/g, '').replace(/^507(?=\d{8}$)/, '');
  btn.addEventListener('eventClick', async () => {
    const a = alias(); PED.alias = a;
    if (a.length < 7){ msg('Escribe tu número de Yappy (8 dígitos, sin +507).'); btn.isButtonLoading = false; return; }
    msg('Preparando tu pago…', true);
    try {
      if (!PED.pedidoYappy){
        PED.pedidoYappy = await Pedidos.crearPedido({
          productId: PED.prod.id,
          extras: extrasElegidos().map(x => ({ itemId: x.id, qty: 1 })),
          fecha: PED.fecha, slotId: PED.franja.id, entrega: PED.entrega,
          zonaId: PED.entrega === 'domicilio' && !PED.fueraZona ? PED.zonaId : null,
          direccion: PED.entrega === 'domicilio' ? PED.direccion : null,
          referencia: PED.entrega === 'domicilio' ? PED.referencia : null,
          cliente: PED.cliente, destinatario: PED.destinatario, dedicatoria: PED.dedicatoria,
          pago: { metodo: 'yappy', comprobante: null },
          pagoTipo: PED.pagoTipo === 'abono' ? 'abono' : 'total'
        });
      }
      const r = await Pedidos.crearOrdenYappyPedido(PED.pedidoYappy.id, a);
      if (!r || !r.ok){ msg((r && r.error) || 'No se pudo crear la orden de pago. Intenta de nuevo.'); btn.isButtonLoading = false; return; }
      PED.yappyOrderId = r.orderId;
      msg('', true);
      aislarYappy(btn);
      btn.eventPayment({ transactionId: r.transactionId, documentName: r.documentName, token: r.token });
    } catch(e){
      restaurarYappy();
      msg(e.message || 'No se pudo preparar el pago.');
      btn.isButtonLoading = false;
      if (/franja|preparar/i.test(e.message || '')){ PED.franja = null; setTimeout(() => irPaso(2), 1800); }
    }
  });
  btn.addEventListener('eventSuccess', () => { restaurarYappy(); esperarConfirmacionYappy(); });
  btn.addEventListener('eventError', () => { restaurarYappy(); msg('El pago no se completó. Puedes intentar de nuevo.'); });
}
// Espera a que el servidor confirme el pago (Yappy avisa y el pedido pasa a CONFIRMADO)
async function esperarConfirmacionYappy(){
  const cuerpo = document.getElementById('p-body');
  if (cuerpo) cuerpo.innerHTML = '<div class="listo"><h3>Confirmando tu pago…</h3><p class="paso-sub">No cierres esta ventana, solo tarda unos segundos.</p></div>';
  const fin = Date.now() + 150000;
  let estado = 'pendiente';
  while (Date.now() < fin){
    estado = await Pedidos.estadoOrdenYappy(PED.yappyOrderId);
    if (estado === 'ejecutado' || ['rechazado', 'cancelado', 'expirado'].includes(estado)) break;
    await new Promise(r => setTimeout(r, 2500));
  }
  if (estado === 'ejecutado'){ PED.pagadoYappy = true; }
  else if (['rechazado', 'cancelado', 'expirado'].includes(estado)){
    PED.yappyOrderId = null; irPaso(5);
    const e = document.getElementById('p-yappy-msg'); if (e) e.textContent = 'Yappy no aprobó el pago. Puedes intentar de nuevo.';
    return;
  } else { PED.pagoEnRevision = true; }
  PED.resultado = PED.pedidoYappy;
  irPaso(6);
}

// ---- 6. Listo ----
function lanzarCelebracion(){
  const el = document.getElementById('celebracion');
  if(!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(window.__celebracionTimer);
  window.__celebracionTimer = setTimeout(() => el.classList.remove('on'), 1700);
}

function paso6(){
  const r = PED.resultado, n = Pedidos.negocio || {};
  const numero = '#' + String(r.numero).padStart(6, '0');
  const wa = String(n.whatsapp || '').replace(/\D/g, '');
  const texto = encodeURIComponent(`Hola, acabo de hacer el pedido ${numero} (${PED.prod.nombre}) para el ${fechaLarga(PED.fecha)}. A nombre de ${PED.cliente.nombre}.`);
  return `<div class="listo"><div class="check-wrap"><i class="ti ti-check"></i></div>
    <h3>${PED.pagadoYappy ? '¡Pago aprobado!' : '¡Pedido recibido!'}</h3>
    <div class="num">${numero}</div>
    <p class="paso-sub">${PED.pagadoYappy ? 'Tu pedido quedó confirmado. ' + E(n.nombre || '') + ' te escribirá por WhatsApp si necesita algo más.'
      : PED.pagoEnRevision ? 'Estamos esperando la confirmación de Yappy. Si te cobraron, tu pedido se confirmará solo; si tienes dudas, escríbele a ' + E(n.nombre || 'la tienda') + '.'
      : E(n.nombre || '') + ' revisará tu pago y te confirmará por WhatsApp.'}</p></div>
    <div class="resumen">
      <div><span>Producto</span><span>${E(PED.prod.nombre)}</span></div>
      <div><span>Fecha</span><span>${fechaLarga(PED.fecha)}</span></div>
      <div><span>Franja</span><span>${hora12(PED.franja.inicio)} – ${hora12(PED.franja.fin)}</span></div>
      <div><span>Entrega</span><span>${PED.entrega === 'retiro' ? 'Retiro en tienda' : 'A domicilio'}</span></div>
      <div><span>Para</span><span>${E(PED.destinatario.nombre)}</span></div>
      <div class="tot"><span>Total</span><span>${Pedidos.dinero(r.total)}${r.envioPorConfirmar ? ' + envío' : ''}</span></div>
      ${r.abono ? `<div><span>Abono enviado</span><span>${Pedidos.dinero(r.abono)}</span></div>
      <div><span>Pagas al recibir</span><span><b>${Pedidos.dinero(r.saldo)}</b></span></div>` : ''}
    </div>
    ${r.pocaAnticipacion ? '<div class="aviso">Pediste con poca anticipación: el negocio te confirmará si llega a tiempo.</div>' : ''}
    ${wa ? `<a class="btn-sec" href="https://wa.me/${wa}?text=${texto}" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i> Escribir por WhatsApp</a>` : ''}
    <button class="btn-pedir" onclick="cerrarProducto()">Listo</button>`;
}

arrancar();
</script>
